api:
  base-url: ${BASE_URL}
  user-name: ${USER_NAME}
  user-pass: ${USER_PASS}
  client-name: ${CLIENT_NAME}
  client-pass: ${CLIENT_PASS}

tarantool:
  host: ${TARANTOOL_DB_HOST}
  port: ${TARANTOOL_DB_PORT}
  username: ${TARANTOOL_DB_USER}
  password: ${TARANTOOL_DB_PASS}
  connect-timeout-ms: ${TARANTOOL_DB_CONNECT_TIMEOUT_MS}

sqlserver:
  host: ${SQLSERVER_DB_HOST}
  port: ${SQLSERVER_DB_PORT}
  database: ${SQLSERVER_DB_NAME}
  username: ${SQLSERVER_DB_USER}
  password: ${SQLSERVER_DB_PASS}
  encrypt: false
  trustServerCertificate: true
